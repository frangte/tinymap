<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sài Gòn Q1 Diorama</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body data-mode="menu">
    <div id="stage" data-model="models/saigon_mini.glb" data-nav="models/saigon_mini"></div>
    <!-- names and chat bubbles over the other players (nameTags.ts), under every card -->
    <div class="tags" id="tags" data-modes="play" aria-hidden="true"></div>

    <!-- start menu: shows the loader first, then the two ways in -->
    <section class="menu card" id="menu" data-modes="menu" aria-labelledby="menu-title">
      <div class="menu-top">
        <div class="eyebrow" data-i18n="menuEyebrow"></div>
        <!-- the language switch (langSwitch.ts): each language named in itself -->
        <div class="lang-seg" id="lang-seg" role="group" data-i18n-aria="language">
          <button type="button" data-lang="vi" lang="vi" aria-pressed="false">Tiếng Việt</button>
          <button type="button" data-lang="en" lang="en" aria-pressed="false">English</button>
        </div>
      </div>
      <h1 id="menu-title">Sài Gòn Q1</h1>
      <p class="lede" data-i18n="menuLede"></p>
      <p class="status" id="menu-status" role="status" aria-live="polite"></p>
      <div class="loadrow" id="loadrow">
        <div class="bar"><i id="loadbar"></i></div>
        <small id="loadmb">0.0 / 2.0 MB</small>
      </div>
      <div class="modes">
        <button class="mode mode-primary" id="mode-play" type="button" disabled>
          <kbd>1</kbd>
          <span><strong data-i18n="modePlay"></strong><small data-i18n="modePlayNote"></small></span>
        </button>
        <button class="mode" id="mode-map" type="button" disabled>
          <kbd>2</kbd>
          <span><strong data-i18n="modeMap"></strong><small data-i18n="modeMapNote"></small></span>
        </button>
      </div>
    </section>

    <!-- top left: where you are, and under it the quest tracker (questTracker.ts) in play -->
    <div class="topleft" data-modes="map play">
      <header class="where card" data-modes="map play" aria-live="polite">
        <div class="eyebrow" id="where-eyebrow"></div>
        <h1 id="where"></h1>
        <div class="note" id="wherenote"></div>
        <div class="online" id="online" data-status="offline" hidden><i aria-hidden="true"></i><span id="online-text"></span></div>
      </header>
      <button class="tracker card" id="tracker" type="button" data-modes="play" hidden>
        <span class="tracker-text">
          <span class="eyebrow" id="tracker-quest"></span>
          <span class="tracker-goal" id="tracker-goal"></span>
        </span>
        <span class="tracker-way">
          <svg class="tracker-arrow" id="tracker-arrow" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3l7 17-7-4-7 4z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" /></svg>
          <span class="tracker-dist" id="tracker-dist"></span>
        </span>
      </button>
    </div>

    <div class="tools" data-modes="map play">
      <button id="lang" type="button" data-i18n="otherLanguage" data-i18n-title="otherLanguageTitle"></button>
      <button id="sound" type="button" aria-pressed="true" data-i18n="sound" data-i18n-title="soundTitle"></button>
      <button id="ink" type="button" data-modes="map" aria-pressed="false" data-i18n="ink" data-i18n-title="inkTitle"></button>
      <button id="dress-open" type="button" data-modes="play" data-i18n="dress" data-i18n-title="dressTitle"></button>
      <!-- its label and title are the archetype's (app.ts) -->
      <button id="respawn" type="button" data-modes="play"></button>
      <button id="to-map" type="button" data-modes="play" data-i18n="toMap" data-i18n-title="toMapTitle"></button>
      <button id="to-play" class="btn-primary" type="button" data-modes="map" data-i18n="toPlay" data-i18n-title="toPlayTitle"></button>
    </div>

    <div class="toast card" id="toast" role="status" data-modes="play" hidden></div>

    <!-- a ride offer for a driver on duty (src/game/offerBanner.ts) -->
    <section class="offer card" id="offer" data-modes="play" aria-labelledby="offer-who" hidden>
      <div class="offer-text">
        <strong id="offer-who" aria-live="assertive"></strong>
        <span id="offer-where"></span>
      </div>
      <div class="offer-actions">
        <button class="btn-primary" id="offer-take" type="button" data-i18n="takeRide"></button>
        <button id="offer-skip" type="button" data-i18n="skip"></button>
      </div>
      <i class="offer-bar" id="offer-bar" aria-hidden="true"></i>
    </section>

    <!-- a Traveler asking the way, for a Citizen (src/game/callBanner.ts) -->
    <section class="offer card" id="way-call" data-modes="play" aria-labelledby="way-call-who" hidden>
      <div class="offer-text">
        <strong id="way-call-who" aria-live="assertive"></strong>
        <span id="way-call-where"></span>
      </div>
      <div class="offer-actions">
        <span class="offer-hint" id="way-call-hint"></span>
        <button id="way-call-skip" type="button" data-i18n="skip"></button>
      </div>
      <i class="offer-bar" id="way-call-bar" aria-hidden="true"></i>
    </section>

    <!-- dressing: opens on the first "Vào game" and from "Đổi đồ"; buttons are filled in by dressPanel.ts.
         Every text here comes from src/game/i18n/page.ts (data-i18n keys) or from the module that owns it. -->
    <section class="dress card" id="dress" data-modes="play" aria-labelledby="dress-title" hidden>
      <div class="eyebrow" data-i18n="character"></div>
      <h2 id="dress-title" data-i18n="chooseCharacter"></h2>
      <label class="field">
        <span data-i18n="displayName"></span>
        <input id="dress-name" type="text" autocomplete="nickname" spellcheck="false" enterkeyhint="done" data-i18n-placeholder="namePlaceholder" />
      </label>
      <fieldset>
        <legend data-i18n="gender"></legend>
        <div class="seg" id="dress-body"></div>
      </fieldset>
      <fieldset>
        <legend data-i18n="outfit"></legend>
        <div class="outfits" id="dress-outfit"></div>
      </fieldset>
      <fieldset>
        <legend data-i18n="hat"></legend>
        <div class="seg" id="dress-hat"></div>
      </fieldset>
      <div class="dress-actions">
        <button id="dress-cancel" type="button" data-i18n="cancel"></button>
        <button id="dress-done" class="btn-primary" type="button" data-i18n="dressDone"></button>
      </div>
    </section>

    <!-- "Bạn là ai?": the archetype cards, before the first dressing and from the phone's Hồ sơ app to change
         archetype (archetypePicker.ts fills them in and sets the title and lede) -->
    <section class="picker card" id="picker" data-modes="play" aria-labelledby="picker-title" hidden>
      <div class="eyebrow" data-i18n="character"></div>
      <h2 id="picker-title"></h2>
      <p class="picker-lede" id="picker-lede"></p>
      <div class="picker-cards" id="picker-cards"></div>
      <button id="picker-cancel" class="picker-cancel" type="button" data-i18n="cancel" hidden></button>
    </section>

    <!-- the arrival card (storyCard.ts): who you are and what to do, once per visit before going online -->
    <section class="story card" id="story" data-modes="play" role="dialog" aria-modal="false" aria-labelledby="story-title" hidden>
      <div class="story-head">
        <span class="badge" id="story-badge"></span>
        <div class="eyebrow" data-i18n="yourStory"></div>
      </div>
      <h2 id="story-title"></h2>
      <p class="story-opening" id="story-opening"></p>
      <div class="story-block">
        <div class="eyebrow" data-i18n="todo"></div>
        <ol class="story-todo" id="story-todo"></ol>
      </div>
      <p class="story-tip" id="story-tip"></p>
      <div class="story-keys">
        <span class="mouse-only"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> <span data-i18n="keyWalk"></span></span>
        <span class="mouse-only"><kbd>Shift</kbd> <span data-i18n="keyRun"></span></span>
        <span class="mouse-only"><kbd>E</kbd> <span data-i18n="keyTalk"></span></span>
        <span class="mouse-only"><kbd>P</kbd> <span data-i18n="keyPhone"></span></span>
        <span class="mouse-only" data-i18n="dragToTurn"></span>
        <span class="touch-only" data-i18n="touchStoryMove"></span>
        <span class="touch-only" data-i18n="touchStoryPhone"></span>
      </div>
      <button id="story-go" class="btn-primary" type="button" data-i18n="start"></button>
    </section>

    <!-- a conversation with an NPC (dialogueSheet.ts): bottom centre, the answers as big buttons -->
    <section class="talk card" id="talk" data-modes="play" role="dialog" aria-modal="false" aria-labelledby="talk-name" hidden>
      <header class="talk-head">
        <div class="talk-who">
          <h2 id="talk-name"></h2>
          <span class="talk-role" id="talk-role"></span>
        </div>
        <span class="talk-group" id="talk-group" hidden></span>
        <button class="talk-close" id="talk-close" type="button" data-i18n-aria="stopTalking" data-i18n-title="stopTalkingTitle">×</button>
      </header>
      <div class="talk-line" aria-live="polite" aria-atomic="true">
        <p class="talk-say" id="talk-say"></p>
        <p class="talk-gloss" id="talk-gloss" lang="en" hidden></p>
      </div>
      <p class="talk-wait" id="talk-wait" data-i18n="groupWait" hidden></p>
      <div class="talk-choices" id="talk-choices" role="group" data-i18n-aria="answers"></div>
    </section>

    <!-- bottom left in play: the chat (chatBox.ts) stacked over the control hint -->
    <div class="corner" data-modes="play">
      <section class="chat" id="chat" data-i18n-aria="chat">
        <ol class="chat-log" id="chat-log" aria-live="polite"></ol>
        <p class="chat-note" id="chat-note" role="status" hidden></p>
        <form class="chat-form" id="chat-form" hidden>
          <!-- its label is the channel (chatBox.ts) -->
          <button type="button" class="chat-ch" id="chat-ch"></button>
          <input id="chat-input" type="text" autocomplete="off" spellcheck="false" enterkeyhint="send" data-i18n-aria="message" />
          <button type="submit" class="btn-primary" data-i18n="send"></button>
        </form>
      </section>
      <div class="hint card" id="hint-play" data-modes="play">
        <span class="mouse-only"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> <span data-i18n="keyWalk"></span></span>
        <span class="mouse-only"><kbd>Shift</kbd> <span data-i18n="keyRun"></span></span>
        <span class="mouse-only"><kbd>Space</kbd> <span data-i18n="keyJump"></span></span>
        <span class="mouse-only"><kbd>1</kbd>…<kbd>4</kbd> <span data-i18n="keyEmotes"></span></span>
        <span class="mouse-only"><kbd>E</kbd> <span data-i18n="keyTalk"></span></span>
        <span class="mouse-only" data-i18n="dragToTurn"></span>
        <span class="mouse-only" data-i18n="scrollToZoom"></span>
        <span class="mouse-only"><kbd>Enter</kbd> <span data-i18n="keyChat"></span></span>
        <span class="mouse-only"><kbd>P</kbd> <span data-i18n="keyPhone"></span></span>
        <span class="mouse-only"><kbd>C</kbd> <span data-i18n="keyOutfit"></span></span>
        <span class="mouse-only"><kbd>Esc</kbd> <span data-i18n="keyMenu"></span></span>
        <span class="touch-only" data-i18n="touchWalk"></span>
        <span class="touch-only" data-i18n="touchTurn"></span>
        <span class="touch-only" data-i18n="touchActions"></span>
      </div>
    </div>

    <!-- the in-game phone (src/game/phone/): the apps the server lists, drawn by id; the round button bottom right -->
    <section class="phone card" id="phone" data-modes="play" aria-labelledby="phone-title" hidden>
      <header class="phone-bar">
        <button class="phone-back" id="phone-back" type="button" data-i18n-aria="phoneHome" hidden>‹</button>
        <!-- the title is the open app's (phone.ts) -->
        <h2 id="phone-title"></h2>
        <button class="phone-close" id="phone-close" type="button" data-i18n-aria="phoneClose">×</button>
      </header>
      <div class="phone-home" id="phone-home"></div>
      <div class="phone-view" id="phone-view" hidden></div>
    </section>
    <button class="phone-toggle btn-primary" id="phone-toggle" type="button" data-modes="play" aria-expanded="false" aria-controls="phone" data-i18n-aria="phone">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2" stroke="currentColor" stroke-width="2.2" fill="none" /><path d="M11 17.5h2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" /></svg>
      <span class="phone-dot" id="phone-dot" hidden></span>
    </button>

    <!-- jump, the action at hand and the emotes (src/game/actionPad.ts), above the phone button -->
    <div class="actions" data-modes="play">
      <button class="act-use btn-primary" id="act-use" type="button" hidden><kbd class="mouse-only">E</kbd><span id="act-use-text"></span></button>
      <div class="act-row">
        <div class="emote-menu card" id="emote-menu" role="group" data-i18n-aria="emotes" hidden></div>
        <button class="act" id="act-emote" type="button" aria-expanded="false" aria-controls="emote-menu" data-i18n-aria="emotes" data-i18n-title="emotes">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.2" fill="none" /><path d="M8 14.2c1 1.6 2.4 2.3 4 2.3s3-.7 4-2.3" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" /><circle cx="9" cy="9.8" r="1.3" fill="currentColor" /><circle cx="15" cy="9.8" r="1.3" fill="currentColor" /></svg>
        </button>
      </div>
      <button class="act touch-only" id="act-jump" type="button" data-i18n-aria="jump" data-i18n-title="jump">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 19V6M6.5 11.5 12 6l5.5 5.5" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </button>
    </div>

    <div class="dock" data-modes="map">
      <div class="hint-line">
        <span class="mouse-only"><span data-i18n="mapHintMouse"></span> <kbd>Esc</kbd> <span data-i18n="keyMenu"></span></span>
        <span class="touch-only" data-i18n="mapHintTouch"></span>
      </div>
      <nav class="chips" id="chips" data-i18n-aria="landmarks"></nav>
    </div>

    <div class="joy" id="joy" data-modes="play" hidden><i id="knob"></i></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
